# 依存ライブラリ・Actions の更新PRを毎週作成する
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      # Spring 系はまとめて更新（個別更新だとバージョン不整合になりやすい）
      spring:
        patterns:
          - "org.springframework*"
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      # 開発依存はまとめて更新する
      dev-dependencies:
        dependency-type: development
    ignore:
      # 非互換なメジャー更新は自動で取り込まない（上げるときは手動で対応する）
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: msw
        update-types: ["version-update:semver-major"]
      - dependency-name: msw-storybook-addon
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
