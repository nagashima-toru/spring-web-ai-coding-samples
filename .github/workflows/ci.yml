# CI: PR・main への push でビルド＋全品質チェックを実行する
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ./mvnw clean verify に以下が全て含まれる:
  #   - OpenAPI からのコード生成 / コンパイル / 単体テスト（Surefire） / 結合テスト（Failsafe + Testcontainers）
  #   - 静的解析（Checkstyle / SpotBugs）
  #   - カバレッジ閾値チェック（JaCoCo 命令カバレッジ80%）
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: チェックアウト
        uses: actions/checkout@v7

      - name: JDK 25 セットアップ
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: ビルド・テスト・静的解析・カバレッジ
        # 結合テストは Testcontainers が GitHub ホステッドランナーの Docker を使用する
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: テスト結果のアップロード（失敗時の調査用）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
          retention-days: 7

      - name: カバレッジレポートのアップロード
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-jacoco-reports
          path: backend/**/target/site/jacoco/
          retention-days: 7
