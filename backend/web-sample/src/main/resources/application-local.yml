# ローカル開発用（--spring.profiles.active=local）。値はローカル専用の固定値
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/webdb
    username: web_admin
    password: web_admin
  flyway:
    # ローカル用の初期データ（db/local）も適用する
    locations: classpath:db/migration,classpath:db/local

app:
  security:
    jwt:
      secret: local-development-secret-key-change-me-0123456789
    cors:
      allowed-origins: http://localhost:3000

logging:
  level:
    com.example.web: DEBUG
